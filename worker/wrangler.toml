name = "weatherpets-weather"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   WEATHERKIT_P8  - full contents of the WeatherKit .p8 private key file
#   KEY_ID         - 10-char Key ID of the WeatherKit key
#   TEAM_ID        - Apple Developer Team ID
#   SERVICE_ID     - Services ID registered for web weather (e.g. com.weatherpets.web-weather)

name = "weatherpets-share"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Serves the shared-pet pages (myweatherpets.com/p/<shareId>) with full SSR —
# per-share <title>/OG tags render at share time so iMessage/WhatsApp previews
# show the actual pet. Reads the public sharedPets/{shareId} Firestore doc via
# REST (unauthenticated; security rules only allow reading ACTIVE shares).
#
# Deploy:  npx wrangler deploy
# Dev:     npx wrangler dev   → http://localhost:8787/p/<shareId>
#
# ACTIVATION (after the myweatherpets.com zone moves to Cloudflare):
# uncomment the routes block below and redeploy. Until then the worker is
# reachable on workers.dev only and the GitHub Pages 404.html fallback serves
# /p/* links client-side.
workers_dev = true

# routes = [
#   { pattern = "myweatherpets.com/p/*", zone_name = "myweatherpets.com" }
# ]

